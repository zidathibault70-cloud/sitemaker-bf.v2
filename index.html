async function publish(){let n=document.getElementById('prod').value.trim(),desc=document.getElementById('pubDesc').value.trim(),p=Number(document.getElementById('price').value),image=(document.getElementById('pubImage')||{}).value||'',category=(document.getElementById('pubCategory')||{}).value||'Produit',contact=(document.getElementById('pubContact')||{}).value||'',platforms=[...document.querySelectorAll('.pubPlatform:checked')].map(x=>x.value);if(!n||!p||!desc)return alert('Renseigne le nom, la description et le prix.');let r=C.rules.reduce((a,b)=>Math.abs(b[0]-p)<Math.abs(a[0]-p)?b:a);let d={name:n,desc,price:p,image,category,contact,platforms},html=publicPublicationHtml(d),url=await publishPublicationServer(d)||makeLocalLink(html);s.publications.push({...d,url,createdAt:new Date().toLocaleString('fr-FR')});s.pubs++;s.activity.push('Publication créée : '+n+' · '+money(p)+' · lien créé');save();document.getElementById('createArea').innerHTML='<div class="card"><h3>✅ Publication créée</h3><p class="muted">Voici le lien à partager.</p><input class="input" value="'+esc(url)+'" readonly onclick="this.select()"><a class="btn green full" target="_blank" href="'+esc(url)+'">📣 Ouvrir la publication</a><button class="btn white full" style="border:1px solid #d8dee8" onclick="navigator.clipboard&&navigator.clipboard.writeText('+JSON.stringify(url)+').then(()=>alert(\'Lien copié.\'))">📋 Copier le lien</button><p class="muted">Commission indicative appliquée au barème le plus proche : '+Math.round(r[1]*100)+' %.</p></div>'}
